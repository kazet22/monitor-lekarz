name: Monitor terminow

on:
  schedule:
    - cron: "*/10 * * * *"   # co 10 minut (GitHub bywa opozniony o kilka minut)
  workflow_dispatch:          # pozwala uruchomic recznie z zakladki Actions

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zaleznosci
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Przywroc zapamietane terminy
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Sprawdz terminy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor_once.py

      - name: Zapisz zapamietane terminy
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
